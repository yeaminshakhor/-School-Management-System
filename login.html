<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="login" data-nav="" data-title="Login">
<main class="wrap" id="main">
<h1>Login</h1>
<div id="login-error"></div>
<form id="login-form" class="form narrow" novalidate>
  <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" required autocomplete="username"></div>
  <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" required autocomplete="current-password"></div>
  <button class="btn btn-primary" type="submit">Login</button>
</form>
</main>
<script src="assets/js/main.js"></script>
</body>
</html>
