<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notices | Teacher | Greenfield School</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/teacher.css">
</head>
<body class="t-body" data-page="notices">
<div id="t-header"></div>
<div class="t-shell">
<aside class="t-side" id="t-sidebar"></aside>
<main class="t-main">
<div class="t-title-row"><h1><span data-icon="notices"></span>Class Notices</h1></div>
<div class="alert" id="message" role="status" hidden></div>

<p class="empty" id="no-class" hidden>You are not assigned to any class yet. Ask the admin to assign you a class or a subject.</p>

<div class="t-notice-grid" id="content">
  <form class="form" id="notice-form" novalidate>
    <h2 id="form-title" style="margin-top:0">Post a notice</h2>
    <div class="field">
      <label for="n-class">Class</label>
      <select id="n-class"></select>
      <span class="field-error" id="err-class"></span>
    </div>
    <div class="field">
      <label for="n-title">Title</label>
      <input type="text" id="n-title" maxlength="100" autocomplete="off">
      <span class="field-error" id="err-title"></span>
    </div>
    <div class="field">
      <label for="n-details">Details</label>
      <textarea id="n-details" maxlength="1000"></textarea>
      <span class="field-error" id="err-details"></span>
    </div>
    <div class="t-actions" style="margin-top:0">
      <button class="btn btn-primary" type="submit" id="n-submit">Post notice</button>
      <button class="btn btn-outline" type="button" id="n-cancel" hidden>Cancel</button>
    </div>
  </form>
  <section>
    <h2 style="margin-top:0">Your notices</h2>
    <div id="list"></div>
  </section>
</div>
</main>
</div>
<script src="js/teacher-common.js"></script>
<script src="js/teacher-notices.js"></script>
</body>
</html>
